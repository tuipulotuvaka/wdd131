<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="WDD 131 Product Review Form for submitting a product review.">
    <meta name="author" content="Lea Mei Vaka Tu'ipulotu">

    <title>Product Review | WDD 131</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>

<body>
    <header>
        <h1>Product Review</h1>
    </header>

    <main>
        <form method="get" action="review.html">

            <p class="required-note">
                <span aria-hidden="true">*</span> Required fields
            </p>

            <div class="form-group">
                <label for="productName">
                    Product Name <span class="required" aria-hidden="true">*</span>
                </label>

                <select id="productName" name="productName" required>
                    <option value="" disabled selected>Choose a Product ...</option>
                </select>
            </div>

            <fieldset>
                <legend>
                    Overall Rating
                    <span class="required" aria-hidden="true">*</span>
                </legend>

                <div class="rating">
                    <label for="rating1">
                        <span class="stars">☆</span>
                        <input type="radio" id="rating1" name="rating" value="1" required>
                        <span class="sr-only">1 star</span>
                    </label>

                    <label for="rating2">
                        <span class="stars">☆☆</span>
                        <input type="radio" id="rating2" name="rating" value="2" required>
                        <span class="sr-only">2 stars</span>
                    </label>

                    <label for="rating3">
                        <span class="stars">☆☆☆</span>
                        <input type="radio" id="rating3" name="rating" value="3" required>
                        <span class="sr-only">3 stars</span>
                    </label>

                    <label for="rating4">
                        <span class="stars">☆☆☆☆</span>
                        <input type="radio" id="rating4" name="rating" value="4" required>
                        <span class="sr-only">4 stars</span>
                    </label>

                    <label for="rating5">
                        <span class="stars">☆☆☆☆☆</span>
                        <input type="radio" id="rating5" name="rating" value="5" required>
                        <span class="sr-only">5 stars</span>
                    </label>
                </div>
            </fieldset>

            <div class="form-group">
                <label for="installDate">
                    Date of Installation
                    <span class="required" aria-hidden="true">*</span>
                </label>

                <input type="date" id="installDate" name="installDate" required>
            </div>

            <fieldset>
                <legend>
                    Which features did you find useful in the product?
                    <span class="optional">(Check all that apply)</span>
                </legend>

                <label for="feature1">
                    <input type="checkbox" id="feature1" name="features" value="Durability">
                    Durability
                </label>

                <label for="feature2">
                    <input type="checkbox" id="feature2" name="features" value="Ease of Use">
                    Ease of Use
                </label>

                <label for="feature3">
                    <input type="checkbox" id="feature3" name="features" value="Performance">
                    Performance
                </label>

                <label for="feature4">
                    <input type="checkbox" id="feature4" name="features" value="Design">
                    Design
                </label>
            </fieldset>

            <div class="form-group">
                <label for="writtenReview">
                    Written Review <span class="optional">(Optional)</span>
                </label>

                <textarea id="writtenReview" name="writtenReview"></textarea>
            </div>

            <div class="form-group">
                <label for="userName">
                    Your Name <span class="optional">(Optional)</span>
                </label>

                <input type="text" id="userName" name="userName" autocomplete="name">
            </div>

            <input type="submit" value="Post Review" class="submit-button">
        </form>
    </main>

    <footer>
        <p>&copy; <span id="currentyear"></span> Lea Mei Vaka Tu'ipulotu</p>
        <p>Last Modification: <span id="lastModified"></span></p>
    </footer>
</body>
</html>
